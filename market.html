<style>
/* Gridiron Ledger: own tokens, light + dark, WCAG AA (checked in tests/test_site_infra.py). Phone first (375 px). */
:root {
  --bg: #f4f2ec; --surface: #ffffff; --fg: #1c2127; --muted: #4b5661;
  --border: #d6d2c6; --border-strong: #7a7468;
  --accent: #0b5a9e; --accent-fg: #ffffff;
  --ok: #19692f; --bad: #a3171c; --warn: #7f4600;
  --radius: 10px; --gap: 14px; --w: 880px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1317; --surface: #161d23; --fg: #e8ebee; --muted: #a5b0ba;
    --border: #2b343c; --border-strong: #6b7884;
    --accent: #7ab8f0; --accent-fg: #0a1218;
    --ok: #6fd68f; --bad: #ff9094; --warn: #f2b45a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
h1, h2 { line-height: 1.2; margin: 0 0 8px; }
h1 { font-size: 1.4rem; } h2 { font-size: 1.1rem; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
tr[tabindex]:focus-visible { outline: none; }
tr[tabindex]:focus-visible > td { box-shadow: inset 0 3px 0 var(--accent), inset 0 -3px 0 var(--accent); }
tr[tabindex]:focus-visible > td:first-child { box-shadow: inset 0 3px 0 var(--accent), inset 0 -3px 0 var(--accent), inset 3px 0 0 var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.brand { letter-spacing: .01em; }

/* buttons and inputs: 44 px touch targets */
label { display: block; font-weight: 600; margin: 12px 0 4px; }
input[type=password], input[type=text], input[type=number] {
  width: 100%; min-height: 44px; padding: 8px 12px; font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: 8px;
}
.check { display: flex; align-items: center; gap: 10px; font-weight: 400; min-height: 44px; }
.check input { width: 22px; height: 22px; }
.btn {
  min-height: 44px; padding: 8px 16px; font: inherit; font-weight: 600; color: var(--fg); background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: 8px; cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 8px 0; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .6; cursor: not-allowed; }
.err { color: var(--bad); margin: 8px 0 0; font-weight: 600; }
.err:empty { margin: 0; }                       /* collapses when empty but stays in the DOM so role=alert still announces */
.note { font-size: .9rem; margin: 0 0 8px; }
ol.steps { margin: 8px 0 12px; padding-left: 1.3rem; } ol.steps li { margin: 4px 0; }

/* locked page */
body.lock { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
.lock-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.lock-card .btn.primary { width: 100%; margin-top: 8px; }

/* app shell */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: relative; }
.top .brand { margin: 0; font-size: 1.15rem; }
.menu { margin: 0; }
.menu summary { min-height: 44px; min-width: 44px; padding: 0 12px; justify-content: center; border: 1px solid var(--border-strong); border-radius: 8px; list-style: none; cursor: pointer; }
.menu summary::-webkit-details-marker { display: none; }
.menu[open] summary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.menu-body { position: absolute; right: 16px; top: 100%; z-index: 5; display: grid; gap: 8px; width: min(18rem, calc(100vw - 32px)); padding: 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); }
.nav { overflow-x: auto; padding: 4px 16px; background: var(--surface); border-bottom: 1px solid var(--border); -webkit-overflow-scrolling: touch;
       -webkit-mask-image: linear-gradient(to right, black calc(100% - 28px), transparent); mask-image: linear-gradient(to right, black calc(100% - 28px), transparent); }
.nav ul { display: flex; gap: 6px; margin: 0; padding: 0 28px 0 0; list-style: none; }
.nav li { flex: none; }
.nav a { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 8px; white-space: nowrap; text-decoration: none; }
.nav a[aria-disabled="true"] { color: var(--muted); border: 1px dashed var(--border-strong); cursor: default; }
.soon { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
main.app { max-width: var(--w); margin: 0 auto; padding: 16px; display: grid; gap: var(--gap); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }

/* run panel */
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.row > .grow { flex: 1 1 140px; min-width: 0; }
.row .btn { flex: 0 0 auto; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; font-weight: 600; font-size: .9rem; }
.pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); } .pill.info { color: var(--accent); }
#gl-run-status { margin: 10px 0 0; }
#gl-run-detail { margin: 6px 0 0; color: var(--muted); }
#gl-run-detail:empty { margin: 0; }
.field-err { margin-top: 4px; }

/* tables scroll inside their card, never the page */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

@media (max-width: 480px) {
  th, td { padding: 8px 4px; font-size: .85rem; white-space: normal; }
  td.time, th { white-space: nowrap; }
  .pill { padding: 1px 8px; font-size: .8rem; border-radius: 10px; line-height: 1.3; }
  .card { padding: 14px 12px; }
}
@media (min-width: 720px) { h1 { font-size: 1.7rem; } .top, .nav { padding-left: max(16px, calc((100vw - var(--w)) / 2)); padding-right: max(16px, calc((100vw - var(--w)) / 2)); } }

/* ---- site pages (WS2-S1): tokens above only ---- */
html, body { max-width: 100%; overflow-x: clip; }
.nav a[aria-current="page"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
h3 { font-size: 1rem; margin: 14px 0 6px; }
code { font-family: var(--mono); font-size: .85em; overflow-wrap: anywhere; }
.foot { font-size: .85rem; padding: 0 4px 24px; }
.notice { margin: 8px 0; padding: 10px 12px; border: 1px dashed var(--border-strong); border-radius: 8px; color: var(--muted); }
.notes { margin: 10px 0 0; padding-left: 1.2rem; color: var(--muted); font-size: .9rem; } .notes li { margin: 5px 0; }
.verdict { font-size: 1.05rem; }
caption { text-align: left; color: var(--muted); padding: 0 0 6px; font-size: .85rem; caption-side: top; }
.small { display: inline-block; margin-left: 4px; padding: 0 6px; border: 1px solid var(--warn); border-radius: 6px; color: var(--warn); font-size: .75rem; font-weight: 700; white-space: nowrap; }
.at { color: var(--muted); font-size: .8em; }
/* weekly matchup cell: away team on line 1, "at Home" on line 2. The link is inline-flex (44px tap target), and flex layout drops the whitespace between its
   flex items; so each team line is ONE flex item (.mu-away, .mu-home) with its text in normal inline flow, and the "at" space stays inside .mu-home. Never make .at or .mu-home a flex/grid/block box. */
.mu, td a.mu, th a.mu { display: inline-flex; flex-direction: column; align-items: flex-start; justify-content: center; max-width: 100%; }
.mu-away, .mu-home { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 11rem; }   /* one team per line, never wrapped ("at" stays with the home name); capped so the sticky column cannot eat the card, full names in the title */
.bf { font-size: .7rem; font-weight: 700; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 3px; text-decoration: none; }
.su.ok { color: var(--ok); font-weight: 700; } .su.bad { color: var(--bad); font-weight: 700; }

/* tables: the container scrolls, the page never does */
.scroll { max-width: 100%; -webkit-overflow-scrolling: touch;
  /* scroll hint: an edge shade on each side that has more content (the "local" covers hide it at that end) */
  background:
    linear-gradient(to right, var(--surface), var(--surface)) 0 0 / 24px 100% no-repeat local,
    linear-gradient(to left, var(--surface), var(--surface)) 100% 0 / 24px 100% no-repeat local,
    linear-gradient(to right, color-mix(in srgb, var(--fg) 22%, transparent), transparent) 0 0 / 18px 100% no-repeat scroll,
    linear-gradient(to left, color-mix(in srgb, var(--fg) 22%, transparent), transparent) 100% 0 / 18px 100% no-repeat scroll; }
.scroll:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
table.sticky1 th.sticky, table.sticky1 thead th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.sticky1 tbody th.sticky { color: var(--fg); font-weight: 600; white-space: normal; min-width: 7.5rem; max-width: 11rem; border-right: 1px solid var(--border); }
table.weekly td.pick, table.weekly td.time { white-space: nowrap; }
tr.total th, tr.total td { font-weight: 700; border-top: 2px solid var(--border-strong); }
button.sort { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; color: var(--accent); font-weight: 600; text-decoration: underline; }
button.sort:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
th[aria-sort="ascending"] button.sort::after { content: " \25B2"; font-size: .7em; }
th[aria-sort="descending"] button.sort::after { content: " \25BC"; font-size: .7em; }
td.rec { white-space: normal; min-width: 8.5rem; }
.rec-main { display: block; font-weight: 700; font-variant-numeric: tabular-nums; }
.rec-sub { display: block; color: var(--muted); font-size: .8rem; }
table.rules td { white-space: normal; }
td.nw, td.rec .nw, .rec-main { white-space: nowrap; }          /* W-L-P, n and CI never break across lines */
.nw { white-space: nowrap; }
td.weak { color: var(--muted); font-weight: 400; }
.weak-note { font-size: .75rem; white-space: nowrap; }
.nopred { color: var(--muted); font-size: .75rem; font-weight: 400; white-space: normal; }
.rk { display: inline-block; min-width: 1.6em; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
.small-print { font-size: .85rem; }
.banner { margin: 0; padding: 10px 14px; border: 2px solid var(--warn); border-radius: var(--radius); background: var(--surface); color: var(--warn); }

/* filters */
.controls { display: grid; gap: 0 10px; grid-template-columns: 9rem 1fr; margin: 4px 0; }
.controls label { margin: 6px 0 2px; }
.controls .lbl { display: block; font-weight: 600; margin: 12px 0 4px; }
.controls .c-day { grid-column: 1 / -1; min-width: 0; }
.controls > div:only-child { grid-column: 1 / -1; }          /* a lone search box (ratings) spans the row */
select { width: 100%; min-height: 44px; padding: 8px 12px; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; }
.chips { display: flex; flex-wrap: nowrap; gap: 6px; margin-top: 6px; overflow-x: auto; }
.chip { flex: none; min-height: 44px; min-width: 44px; padding: 8px 14px; font: inherit; font-weight: 600; color: var(--fg); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (min-width: 720px) { .controls { grid-template-columns: 11rem 1fr auto; align-items: end; } .controls .c-day { grid-column: auto; } .chips { margin-top: 0; } }
.head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; margin-bottom: 4px; }
.head-row h2 { margin: 0; }
td a, th a, a.back { display: inline-flex; align-items: center; min-height: 44px; }   /* links in table cells and the back link: 44px tap target */
a.jump { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; font-weight: 600; }
details.prov { margin: 0 0 4px; } details.prov summary { font-weight: 400; color: var(--muted); font-size: .9rem; }
details.prov p { margin: 0 0 8px; }
details.rules summary { font-size: 1.05rem; }

/* key / value grid (matchup page) */
.kv { display: grid; gap: 0; margin: 10px 0 0; }
.kv > div { display: grid; grid-template-columns: 1fr; gap: 0; padding: 8px 0; border-bottom: 1px solid var(--border); }
.kv dt { color: var(--muted); font-size: .85rem; font-weight: 600; } .kv dd { margin: 0; overflow-wrap: anywhere; }
@media (min-width: 600px) { .kv > div { grid-template-columns: 13rem 1fr; gap: 12px; } }

/* charts */
.chart-wrap { margin: 12px 0; }
svg.chart { display: block; width: 100%; max-width: 560px; height: auto; background: var(--surface); }
svg.chart .grid { stroke: var(--border); stroke-width: 1; }
svg.chart .tick { fill: var(--muted); font-size: 10px; font-family: var(--font); }
svg.chart .ref { stroke: var(--border-strong); stroke-width: 1; }
svg.chart .ref2 { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 5 3; }
svg.chart .band { fill: var(--accent); fill-opacity: .15; stroke: none; }
svg.chart .band-sasser { fill: var(--ok); fill-opacity: .12; stroke: none; }
svg.chart polyline { stroke-width: 2; stroke-linejoin: round; }
svg.chart polyline.c-ours { stroke: var(--accent); }
svg.chart polyline.c-close { stroke: var(--warn); stroke-dasharray: 6 3; }
svg.chart polyline.c-sasser { stroke: var(--ok); stroke-dasharray: 2 3; }
svg.chart circle.c-ours { fill: var(--accent); } svg.chart circle.c-close { fill: var(--warn); } svg.chart circle.c-sasser { fill: var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; list-style: none; margin: 4px 0 0; padding: 0; color: var(--muted); font-size: .85rem; }
.legend .sw { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--muted); margin-right: 6px; vertical-align: middle; }
.legend .sw.c-ours { border-color: var(--accent); } .legend .sw.c-close { border-color: var(--warn); border-top-style: dashed; }
.legend .sw.c-sasser { border-color: var(--ok); border-top-style: dotted; } .legend .sw.ref2 { border-color: var(--warn); border-top-style: dashed; }
td.wrap { white-space: normal; min-width: 12rem; max-width: 22rem; vertical-align: top; }
table.research td { vertical-align: top; }
ul.src { margin: 0; padding-left: 1rem; }
details { margin: 8px 0; } summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; }
#f-count { margin: 2px 0; font-size: .85rem; }
#f-count:empty { display: none; }

/* shared by the page shells (loaded with every page) */
.sub { color: var(--muted); font-size: .9rem; }
td.time { white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-weight: 600; font-size: .9rem; color: var(--muted); background: none; border: 0; padding: 0 16px; min-height: 44px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }

</style>
</head>

<script>
// Gridiron Ledger: WebCrypto helpers. Inlined into every loader page; also require()-able from node for tests.
// Must match cfb/site/crypt.py: PBKDF2-SHA256 -> AES-256-GCM key; blob = iv(12) || ciphertext||tag; AAD = route name.
var GLC = (function () {
  var enc = new TextEncoder(), dec = new TextDecoder();
  function b64ToBytes(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function bytesToB64(a) { var s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function hexToBytes(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  async function deriveKey(passphrase, saltHex, iterations) {
    var base = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: hexToBytes(saltHex), iterations: iterations },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function exportKeyB64(key) { return bytesToB64(new Uint8Array(await crypto.subtle.exportKey("raw", key))); }
  function importKeyB64(b64) { return crypto.subtle.importKey("raw", b64ToBytes(b64), { name: "AES-GCM" }, true, ["decrypt"]); }
  // bytes: Uint8Array iv||ct||tag. Rejects (OperationError) on a wrong key, wrong aad or tampering.
  async function decryptBytes(key, bytes, aad) {
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12), additionalData: enc.encode(aad) }, key, bytes.slice(12));
    return new Uint8Array(pt);
  }
  async function decryptText(key, bytes, aad) { return dec.decode(await decryptBytes(key, bytes, aad)); }
  // localStorage/sessionStorage key for this site: "gl:" + the URL path it is served under + "/" + name, e.g. gl:/cfb-model/key.
  // (user.github.io hosts several sites on one origin; the path keeps their saved keys apart.)
  function storageKey(base, name) {
    var b = (typeof base === "string" && base.charAt(0) === "/") ? base : "/";
    return "gl:" + b.replace(/\/+$/, "") + "/" + name;
  }
  return { storageKey: storageKey, b64ToBytes: b64ToBytes, bytesToB64: bytesToB64, hexToBytes: hexToBytes, deriveKey: deriveKey, exportKeyB64: exportKeyB64,
           importKeyB64: importKeyB64, decryptBytes: decryptBytes, decryptText: decryptText };
})();
if (typeof module !== "undefined" && module.exports) module.exports = GLC;

</script>
<script>
(function () {
  var root = document.getElementById("gl-loader"), D = root.dataset;
  var form = document.getElementById("gl-form"), pass = document.getElementById("gl-pass"), err = document.getElementById("gl-err");
  var msg = document.getElementById("gl-msg"), go = document.getElementById("gl-go");
  var iter = parseInt(D.iter, 10), route = D.route, prefix = new Array(route.split("/").length).join("../");
  var KEY = GLC.storageKey(D.base, "key"), TOKEN = GLC.storageKey(D.base, "gh_token");   // namespaced by the path this site is served under
  function store(which) { try { return window[which + "Storage"]; } catch (e) { return null; } }
  function drop(k) { ["local", "session"].forEach(function (w) { var s = store(w); if (s) try { s.removeItem(k); } catch (e) {} }); }
  function forgetKey() { drop(KEY); }
  function forgetAll() { drop(KEY); drop(TOKEN); }
  function saved() {
    for (var i = 0, w = ["local", "session"]; i < 2; i++) {
      try { var s = store(w[i]), v = s && s.getItem(KEY); if (v) { v = JSON.parse(v); if (v && v.k && v.s) return v; } } catch (e) {}
    }
    return null;
  }
  function expose(key) {
    window.GL = {
      key: key, route: route, base: D.base, storageKey: function (name) { return GLC.storageKey(D.base, name); },
      lock: function () { forgetKey(); location.reload(); },                      // forget the key, keep the GitHub token
      forgetAll: function () { forgetAll(); location.reload(); },                 // forget the key and the GitHub token
      fetchBytes: async function (path) {
        var r = await fetch(prefix + path + ".enc", { cache: "no-store" });
        if (!r.ok) throw new Error(path + ": HTTP " + r.status);
        return GLC.decryptBytes(key, new Uint8Array(await r.arrayBuffer()), path);
      },
      fetchJSON: async function (path) { return JSON.parse(new TextDecoder().decode(await window.GL.fetchBytes(path))); }
    };
  }
  function render(key, html) { expose(key); document.open(); document.write(html); document.close(); }
  function fail(text) { err.textContent = text; go.disabled = false; pass.disabled = false; go.textContent = "Unlock"; pass.focus(); }

  async function trySaved() {

    pass.value = "";
    try { render(key, html); } catch (e) { fail("Could not open the page: " + (e && e.message ? e.message : e)); }
  });
  document.getElementById("gl-forget").addEventListener("click", function () { forgetAll(); msg.textContent = "Saved key and token removed from this device."; });
